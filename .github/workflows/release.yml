name: Release

# Publica no npm quando uma tag de versão (ex.: v1.0.5) é empurrada.
# Usa OIDC + provenance: a assinatura é verificável no npm e não exige segredo de longa duração,
# apenas o token de publicação (NPM_TOKEN) configurado como secret do repositório.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run check
      - name: Publica no npm com provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
